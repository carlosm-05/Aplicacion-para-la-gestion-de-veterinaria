spring.application.name=Proyecto_Vet

# Base de datos — usa variables de entorno en producción
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/Vet_bd}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1982}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:404D635166546A576E5A7234753778214125442A472D4B6150645367566B5970}
server.port=${PORT:8080}
